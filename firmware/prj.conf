# SPDX-License-Identifier: Apache-2.0
# The board brings up its USB serial port (CDC ACM) as the console at boot: requests come in there
# and printk sends the replies back the same way. Clients find the dongle by its USB product name.
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="airhand"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="airhand"

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=4
# With a full bond table a new pairing request gets no reply; Android shows that as a wrong PIN.
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_DEVICE_NAME="airhand"
# Generic HID
CONFIG_BT_DEVICE_APPEARANCE=960

# The host starts security and PHY changes; starting them from both sides at once drops the link.
CONFIG_BT_GATT_AUTO_SEC_REQ=n
CONFIG_BT_AUTO_PHY_UPDATE=n

# Just Works pairing; bonds survive a reboot, so the host reconnects by itself.
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_INPUT_REP_MAX=5
CONFIG_BT_HIDS_OUTPUT_REP_MAX=0
CONFIG_BT_HIDS_FEATURE_REP_MAX=0
CONFIG_BT_HIDS_ATTR_MAX=48
CONFIG_BT_HIDS_MAX_CLIENT_COUNT=1
CONFIG_BT_HIDS_DEFAULT_PERM_RW_ENCRYPT=y
CONFIG_BT_GATT_UUID16_POOL_SIZE=64
CONFIG_BT_GATT_CHRC_POOL_SIZE=32
CONFIG_BT_CONN_CTX=y

CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x1915
CONFIG_BT_DIS_PNP_PID=0xEEEE
CONFIG_BT_DIS_PNP_VER=0x0100

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# The chip id in the version reply.
CONFIG_HWINFO=y
