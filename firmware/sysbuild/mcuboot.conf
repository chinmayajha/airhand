# The app asks for update mode through the boot mode in retained RAM (app.overlay).
CONFIG_BOOT_SERIAL_BOOT_MODE=y
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_ZEPHYR_RAM=y
CONFIG_RETAINED_MEM_NRF_GPREGRET=n
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
# A fresh install has no app yet; MCUboot then waits on USB for one.
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
# Updates go to the second slot as a test image, so a bad one is swapped back.
CONFIG_MCUBOOT_SERIAL_DIRECT_IMAGE_UPLOAD=y
CONFIG_BOOT_SERIAL_IMG_GRP_IMAGE_STATE=y
CONFIG_USB_DEVICE_PRODUCT="airhand update"
CONFIG_USB_DEVICE_MANUFACTURER="airhand"
CONFIG_BOOT_WATCHDOG_FEED=y
